[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whoanimal"
version = "0.1.0"
description = "Descubre. Identifica. Colecciona. — Experiencia de coleccionismo y aprendizaje sobre animales."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "WHO Animal Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Dependencias actuales mínimas de runtime (mantenidas a cero en fase de fundación para máxima portabilidad)
dependencies = []

[project.optional-dependencies]
# Dependencias para pruebas y control de calidad
dev = [
    "pytest>=8.0.0",
]

# Dependencias previstas para Fase 1 (Validación y APIs de Taxonomía)
planned = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
]

# Dependencias previstas para Fase 2 (Inferencia IA y Backend REST)
future = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
